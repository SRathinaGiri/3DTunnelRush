<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="tunnelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#7000ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Tunnel Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7000ff" stroke-width="8" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ff0077" stroke-width="10" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00ffcc" stroke-width="12" opacity="1" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="20" fill="#00f0ff" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Tunnel Perspective Grid Lines -->
  <line x1="256" y1="46" x2="256" y2="236" stroke="#00f0ff" stroke-width="3" opacity="0.5" />
  <line x1="256" y1="466" x2="256" y2="276" stroke="#00f0ff" stroke-width="3" opacity="0.5" />
  <line x1="46" y1="256" x2="236" y2="256" stroke="#00f0ff" stroke-width="3" opacity="0.5" />
  <line x1="466" y1="256" x2="276" y2="256" stroke="#00f0ff" stroke-width="3" opacity="0.5" />

  <!-- Player Ship Icon -->
  <polygon points="256,180 290,260 256,245 222,260" fill="url(#shipGrad)" stroke="#ffffff" stroke-width="3" filter="url(#neonGlow)" />
</svg>
